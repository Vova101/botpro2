name: Publish HideBlitz update index

on:
  push:
    branches: [ main ]
    paths:
      - 'hideblitz/releases/HideBlitz-v*.exe'
      - 'hideblitz/policy.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install signer dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography

      - name: Build and sign latest.json
        env:
          HIDEBLITZ_UPDATE_PRIVATE_KEY: ${{ secrets.HIDEBLITZ_UPDATE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          root = Path('hideblitz')
          releases = root / 'releases'
          rx = re.compile(r'^HideBlitz-v(\d+)\.(\d+)\.(\d+)\.exe$')
          found = []
          for p in releases.glob('HideBlitz-v*.exe'):
              m = rx.match(p.name)
              if m:
                  found.append((tuple(map(int, m.groups())), p))
          if not found:
              raise SystemExit('No HideBlitz-vMAJOR.MINOR.PATCH.exe files found')
          found.sort()

          policy = {'minimumVersion': '', 'required': False}
          policy_path = root / 'policy.json'
          if policy_path.exists():
              policy.update(json.loads(policy_path.read_text(encoding='utf-8')))

          base = 'https://raw.githubusercontent.com/Vova101/botpro2/main/hideblitz/releases/'
          builds = {}
          for ver_tuple, p in found:
              version = '.'.join(map(str, ver_tuple))
              data = p.read_bytes()
              builds[version] = {
                  'filename': p.name,
                  'url': base + p.name,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              }

          latest_tuple, latest_path = found[-1]
          latest_version = '.'.join(map(str, latest_tuple))
          latest_build = builds[latest_version]
          minimum = str(policy.get('minimumVersion') or latest_version)
          payload_obj = {
              'latest': {'version': latest_version, **latest_build},
              'minimumVersion': minimum,
              'required': bool(policy.get('required', False)),
              'notes': str(policy.get('notes') or f'HideBlitz {latest_version}'),
              'builds': builds,
          }
          payload = json.dumps(payload_obj, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')

          raw_key = os.environ.get('HIDEBLITZ_UPDATE_PRIVATE_KEY', '').strip()
          if not raw_key:
              raise SystemExit('Missing repository secret HIDEBLITZ_UPDATE_PRIVATE_KEY')
          seed = base64.b64decode(raw_key)
          if len(seed) != 32:
              raise SystemExit('HIDEBLITZ_UPDATE_PRIVATE_KEY must be base64 of 32 raw bytes')
          signature = Ed25519PrivateKey.from_private_bytes(seed).sign(payload)

          envelope = {
              'schema': 2,
              'product': 'HideBlitz',
              'keyId': 'hideblitz-prod-1',
              'payload': base64.b64encode(payload).decode('ascii'),
              'signature': base64.b64encode(signature).decode('ascii'),
          }
          (root / 'latest.json').write_text(json.dumps(envelope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Published', latest_version, latest_build['sha256'], latest_build['size'])
          PY

      - name: Commit signed index
        run: |
          if git diff --quiet -- hideblitz/latest.json; then
            echo 'latest.json already current'
            exit 0
          fi
          git config user.name 'HideBlitz Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hideblitz/latest.json
          git commit -m 'Publish signed HideBlitz update index'
          git push
