name: Publish signed HideBlitz release metadata

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'hideblitz/releases/**'
      - 'hideblitz/policy.json'
      - 'hideblitz/sign_release.py'
      - '.github/workflows/hideblitz-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HIDEBLITZ_UPDATE_PRIVATE_KEY: ${{ secrets.HIDEBLITZ_UPDATE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout metadata repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check signing key
        shell: bash
        run: |
          if [ -z "$HIDEBLITZ_UPDATE_PRIVATE_KEY" ]; then
            echo "HIDEBLITZ_UPDATE_PRIVATE_KEY is not configured"
            exit 1
          fi

      - name: Install signing dependency
        run: python3 -m pip install --quiet cryptography

      - name: Resolve official EXE and release
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hideblitz-work
          tag=""
          legacy_path=""

          if [ "${{ github.event_name }}" = "release" ]; then
            tag='${{ github.event.release.tag_name }}'
          elif [ "${{ github.event_name }}" = "push" ]; then
            legacy_path="$(jq -r '[.commits[]? | (.added[]?, .modified[]?)] | .[]' "$GITHUB_EVENT_PATH" 2>/dev/null | grep -E '^hideblitz/releases/HideBlitz-v[0-9]+\.[0-9]+\.[0-9]+\.exe$' | tail -n 1 || true)"
            if [ -n "$legacy_path" ] && [ -f "$legacy_path" ]; then
              filename="$(basename "$legacy_path")"
              version="$(printf '%s' "$filename" | sed -E 's/^HideBlitz-v([0-9]+\.[0-9]+\.[0-9]+)\.exe$/\1/')"
              tag="hideblitz-v${version}"
              cp "$legacy_path" .hideblitz-work/HideBlitz.exe

              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                rm -rf .hideblitz-work/existing
                mkdir -p .hideblitz-work/existing
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern HideBlitz.exe --dir .hideblitz-work/existing >/dev/null 2>&1 || true
                if [ -f .hideblitz-work/existing/HideBlitz.exe ]; then
                  old_hash="$(sha256sum .hideblitz-work/existing/HideBlitz.exe | awk '{print $1}')"
                  new_hash="$(sha256sum .hideblitz-work/HideBlitz.exe | awk '{print $1}')"
                  if [ "$old_hash" != "$new_hash" ]; then
                    echo "Release $tag already exists with different HideBlitz.exe bytes"
                    exit 1
                  fi
                else
                  gh release upload "$tag" .hideblitz-work/HideBlitz.exe --repo "$GITHUB_REPOSITORY"
                fi
              else
                gh release create "$tag" .hideblitz-work/HideBlitz.exe --repo "$GITHUB_REPOSITORY" --title "HideBlitz ${version}" --notes "Официальная portable-сборка HideBlitz. Скачайте HideBlitz.exe; дальнейшие обновления устанавливаются из приложения."
              fi
            fi
          fi

          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          if [ -z "$tag" ]; then
            echo "No published HideBlitz release found"
            exit 1
          fi

          version="$(printf '%s' "$tag" | sed -E 's/^hideblitz-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/')"
          if [ "$version" = "$tag" ]; then
            echo "Release tag must be hideblitz-vMAJOR.MINOR.PATCH, got: $tag"
            exit 1
          fi

          if [ ! -s .hideblitz-work/HideBlitz.exe ]; then
            rm -rf .hideblitz-work/release
            mkdir -p .hideblitz-work/release
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern HideBlitz.exe --dir .hideblitz-work/release
            cp .hideblitz-work/release/HideBlitz.exe .hideblitz-work/HideBlitz.exe
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved official source: $tag"

      - name: Generate signed latest.json
        shell: bash
        run: |
          python3 hideblitz/sign_release.py \
            --exe .hideblitz-work/HideBlitz.exe \
            --version '${{ steps.source.outputs.version }}' \
            --tag '${{ steps.source.outputs.tag }}'

      - name: Keep tiny compatibility index on main
        shell: bash
        run: |
          git config user.name "hideblitz-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hideblitz/latest.json
          if git diff --cached --quiet; then
            echo "Signed latest.json is already current"
          else
            git commit -m "Update signed HideBlitz release index [skip ci]"
            git push
          fi

      - name: Attach signed manifest to GitHub Release
        shell: bash
        run: |
          gh release upload '${{ steps.source.outputs.tag }}' hideblitz/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "First-download asset: https://github.com/Vova101/botpro2/releases/latest/download/HideBlitz.exe"
          echo "Manifest asset: https://github.com/Vova101/botpro2/releases/latest/download/latest.json"
