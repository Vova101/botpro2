name: Manual HideBlitz signed-manifest recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      HIDEBLITZ_UPDATE_PRIVATE_KEY: ${{ secrets.HIDEBLITZ_UPDATE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check recovery signing key
        shell: bash
        run: |
          if [ -z "$HIDEBLITZ_UPDATE_PRIVATE_KEY" ]; then
            echo "HIDEBLITZ_UPDATE_PRIVATE_KEY is not configured"
            exit 1
          fi

      - name: Install signing dependency
        run: python3 -m pip install --quiet cryptography

      - name: Recover latest signed manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          version="$(printf '%s' "$tag" | sed -E 's/^hideblitz-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/')"
          if [ "$version" = "$tag" ]; then
            echo "Latest release tag is not a HideBlitz version: $tag"
            exit 1
          fi
          rm -rf .hideblitz-recovery
          mkdir -p .hideblitz-recovery
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern HideBlitz.exe --dir .hideblitz-recovery
          python3 hideblitz/sign_release.py --exe .hideblitz-recovery/HideBlitz.exe --version "$version" --tag "$tag"
          gh release upload "$tag" hideblitz/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Recovered signed latest.json for $tag"

# Normal HideBlitz releases are built and signed locally with
# HideBlitz/scripts/publish-release.ps1. This workflow never runs automatically,
# so normal publishing consumes no GitHub Actions minutes or artifact storage.
