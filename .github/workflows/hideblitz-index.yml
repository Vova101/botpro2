name: Manual HideBlitz signed-manifest recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft HideBlitz release tag to sign
        required: true
        type: string

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      HIDEBLITZ_UPDATE_PRIVATE_KEY: ${{ secrets.HIDEBLITZ_UPDATE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check recovery signing key
        shell: bash
        run: |
          if [ -z "$HIDEBLITZ_UPDATE_PRIVATE_KEY" ]; then
            echo "HIDEBLITZ_UPDATE_PRIVATE_KEY is not configured"
            exit 1
          fi

      - name: Install signing dependency
        run: python3 -m pip install --quiet cryptography

      - name: Sign a complete draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          version="$(printf '%s' "$tag" | sed -E 's/^hideblitz-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/')"
          if [ "$version" = "$tag" ]; then
            echo "Requested tag is not a HideBlitz version: $tag"
            exit 1
          fi
          is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Refusing to modify a published release: $tag"
            exit 1
          fi

          rm -rf .hideblitz-recovery .hideblitz-previous
          mkdir -p .hideblitz-recovery .hideblitz-previous
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern HideBlitz.exe --dir .hideblitz-recovery

          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir .hideblitz-previous
          cp .hideblitz-previous/latest.json hideblitz/latest.json

          python3 hideblitz/sign_release.py --exe .hideblitz-recovery/HideBlitz.exe --version "$version" --tag "$tag"
          gh release upload "$tag" hideblitz/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "Signed latest.json uploaded to draft $tag"

# Normal HideBlitz releases are built locally. This workflow signs a selected
# draft with the repository secret so the draft can be verified before publish.