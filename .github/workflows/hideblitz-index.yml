name: Build HideBlitz update index

on:
  push:
    branches: [ main ]
    paths:
      - 'hideblitz/releases/**'
      - 'hideblitz/policy.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote

          owner = "Vova101"
          repo = "botpro2"
          root = Path("hideblitz")
          releases = root / "releases"
          latest_path = root / "latest.json"
          policy_path = root / "policy.json"
          releases.mkdir(parents=True, exist_ok=True)

          old = {}
          if latest_path.exists():
              try:
                  old = json.loads(latest_path.read_text(encoding="utf-8"))
              except Exception:
                  old = {}
          builds = dict(old.get("builds") or {})

          pattern = re.compile(r"^HideBlitz-v(\d+\.\d+\.\d+)\.exe$", re.I)
          for path in releases.glob("*.exe"):
              m = pattern.match(path.name)
              if not m:
                  continue
              version = m.group(1)
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              url = f"https://raw.githubusercontent.com/{owner}/{repo}/main/hideblitz/releases/{quote(path.name)}"
              builds[version] = {
                  "filename": path.name,
                  "url": url,
                  "sha256": sha,
                  "size": len(data),
              }

          def version_key(v):
              try:
                  return tuple(int(x) for x in v.split("."))
              except Exception:
                  return (-1, -1, -1)

          valid = [v for v in builds if version_key(v) != (-1, -1, -1)]
          if not valid:
              raise SystemExit("No HideBlitz builds registered. Seed hideblitz/latest.json or upload a release EXE first.")
          latest_version = max(valid, key=version_key)
          latest = builds[latest_version]

          policy = {"minimumVersion": "0.9.0", "required": False}
          if policy_path.exists():
              policy.update(json.loads(policy_path.read_text(encoding="utf-8")))

          payload = {
              "schema": 1,
              "product": "HideBlitz",
              "latest": {
                  "version": latest_version,
                  **latest,
              },
              "minimumVersion": str(policy.get("minimumVersion") or "0.9.0"),
              "required": bool(policy.get("required", False)),
              "builds": dict(sorted(builds.items(), key=lambda kv: version_key(kv[0]))),
          }
          latest_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload["latest"], indent=2))
          PY

      - name: Commit index
        shell: bash
        run: |
          git config user.name "hideblitz-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hideblitz/latest.json
          if git diff --cached --quiet; then
            echo "latest.json is already current"
          else
            git commit -m "Update HideBlitz release index [skip ci]"
            git push
          fi
